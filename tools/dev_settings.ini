; Settings build_install.bat forces into the installed game on every deploy, so every
; feature we add is switched on and can be played right away.
; Rule: a new feature with a toggle gets its "on" line here in the same change.
;
; [GemRB.cfg]           Key=Value lines in D:\Games\GemRB\GemRB.cfg
; [<file>:<section>]    Key = Value in an ini under the game dir (created if missing)

[GemRB.cfg]
; phase 1: OpenGL renderer
VideoDriver=opengl
; phase 2: render at window resolution, eased camera
GLHighResolution=1
SmoothCamera=1
; phase 3: frame-rate interpolation
FrameInterpolation=1
; turn-based combat
Turn Based Combat=1
Turn Based Weapon Speed=1
Turn Based Start On Sight=1
Turn Based Party Groups=1
Turn Based Auto End Turn=1
Turn Based Move Confirm=1

[pst_saves/gem-torment.ini:Graphics]
; mouse-wheel zoom (phase 2)
Zoom Lock = 0
