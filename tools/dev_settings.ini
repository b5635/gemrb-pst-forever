; Settings build_install.bat forces into the installed game on every deploy, so every
; feature we add is switched on and can be played right away.
; Rule: a new feature with a toggle gets its "on" line here in the same change.
;
; [GemRB.cfg]           Key=Value lines in D:\Games\GemRB\GemRB.cfg
; [<file>:<section>]    Key = Value in an ini under the game dir (created if missing)

[GemRB.cfg]
; never let cmake's sample cfg boot the demo
GameType=pst
GamePath=C:\Program Files (x86)\Black Isle\Torment\
CD1=C:\Program Files (x86)\Black Isle\Torment\
CD2=C:\Program Files (x86)\Black Isle\Torment\cd2\
SavePath=D:\Games\GemRB\pst_saves\
Width=1280
Height=720
Fullscreen=0
; phase 1: OpenGL renderer
VideoDriver=opengl
; phase 2: render at window resolution, eased camera
GLHighResolution=1
SmoothCamera=1
; phase 3: frame-rate interpolation
FrameInterpolation=1
; phase 4: lighting (ambient, glowing animations / spells / projectiles)
Lighting=1
PartyLight=0
DynamicLights=1
LightingAmbient=100
; generated depth + normal maps for the lights
LightGeometry=1
LightNormalStrength=80
; automatic scene lights (LIGHTING_PLAN.md)
BakedLights=1
BakedLightGain=100
LightHeightMap=1
LightOcclusion=1
LightOcclusionSteps=16
LightNormalMap=1
SpriteAO=60
AreaKeyLight=1
; phase 5: polish
; soft oval under the feet. Off for now; the outline cast (LightShadows) is the shadow.
ContactShadows=0
LightShadows=1
; baked creature shadow (palette index 1). Off hides it; the contact and light shadows stay.
SpriteShadows=0
SelectionRings=1
HoverOutline=1
HitParticles=1
; our blood / material hit effects replace the original blood splats (hitmat.2da), stains stay N seconds
CustomBlood=1
BloodLinger=30
AmbientParticles=1
SmoothShake=1
ImpactShake=1
Bloom=1
BloomStrength=55
ColorGrading=1
Vignette=35
; pst party of 8: the Nameless One and all seven companions (portrait strip widens past 6)
MaxPartySize=8
; turn-based combat
Turn Based Combat=1
Turn Based Weapon Speed=1
Turn Based Start On Sight=1
Turn Based Party Groups=1
Turn Based Auto End Turn=1
Turn Based Move Confirm=0
Turn Based Tactical AI=1
Turn Based Opportunity Attacks=1
Turn Based Immediate Reactions=1
Turn Based Surprise=1
Turn Based Combat Vision=1
Turn Based Floating Text=1
Turn Based Dice Panel=1
Turn Based Turn Banner=1
; combat camera: +X shifts the character right of centre, +Y toward the bottom (under the HP bar)
Turn Based Camera Offset X=0
Turn Based Camera Offset Y=80
; line along the edge of the movement reach (the dimming outside it stays); off for now
Turn Based Reach Outline=0
; everything in rounds (5 s), in and out of a fight: timed effects last whole rounds (N rounds = the
; target's next N turns in a fight, N round ticks out of it); the buff list shows rounds left
Turn Based Round Durations=1
; delayed spell/item effects (damage synced to the animation, Cone of Cold, Blacksphere...) play out in
; real time inside the caster's turn, which waits until they have landed
Turn Based Spell Playout=1
Hover HP Bar=1
; the spell's name floats over its caster when a cast starts
Spell Cast Text=1
; damage numbers colored by type (fire orange, cold blue, lightning yellow, acid lime, poison green,
; magic magenta); physical stays white
Elemental Damage Colors=1
; BG3-style buff/debuff icons (draining ring = time left, hover for name and rounds) under the hover
; HP bar and next to the party portraits
Status Icons=1
; always-on hotbar above the portraits, replaces the radial menu (right click cancels)
Hotbar=1
; voiced dialogue (PST AI Voices, tools\install_ai_voices.py) stops when the dialogue window closes
Stop Speech On Dialog End=1
; voice the question-mark examine text (VVE: VV<strref> on the TLK line)
InfoPointSounds=1
; upscaled art (UPSCALE_PLAN.md): GL driver draws tools\upscale output at logical size
UpscaledGUI=1
UpscaledAreas=1
UpscaledSprites=1
; fonts: pixel-doubled classic glyphs instead of the upscaled ones (those break thin strokes)
SharpFonts=1
; body text in the EE's BOOKMANI.ttf (eefonts.2da), rendered at window resolution
EEFonts=1
; TEMPORARY while working on the EE UI: skip the intro movies (Start.py reads SkipIntroVideos); remove to get them back
SkipIntroVideos=1
; EE-layout UI (EE_UI_PLAN.md): needs D:\Games\GemRB\ee_ui, else classic screens
EEUI=1
; load every animation of an area's creatures while the area loads, not on first use (no mid-fight hitches)
PreloadAreaSprites=1
; load every upscaled spell/effect animation once per session (first area load) and keep it
PreloadEffects=1

[pst_saves/gem-torment.ini:Graphics]
; mouse-wheel zoom (phase 2)
Zoom Lock = 0
