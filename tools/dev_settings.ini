; Settings build_install.bat forces into the installed game on every deploy, so every
; feature we add is switched on and can be played right away.
; Rule: a new feature with a toggle gets its "on" line here in the same change.
;
; [GemRB.cfg]           Key=Value lines in D:\Games\GemRB\GemRB.cfg
; [<file>:<section>]    Key = Value in an ini under the game dir (created if missing)

[GemRB.cfg]
; phase 1: OpenGL renderer
VideoDriver=opengl
; phase 2: render at window resolution, eased camera
GLHighResolution=1
SmoothCamera=1
; phase 3: frame-rate interpolation
FrameInterpolation=1
; phase 4: lighting (ambient, party light, glowing animations / spells / projectiles)
Lighting=1
PartyLight=1
DynamicLights=1
LightingAmbient=100
; generated depth + normal maps for the lights
LightGeometry=1
LightNormalStrength=80
; phase 5: polish
; soft oval under the feet. Off for now; the outline cast (LightShadows) is the shadow.
ContactShadows=0
LightShadows=1
; baked creature shadow (palette index 1). Off hides it; the contact and light shadows stay.
SpriteShadows=0
SelectionRings=1
HoverOutline=1
HitParticles=1
; our blood / material hit effects replace the original blood splats (hitmat.2da), stains stay N seconds
CustomBlood=1
BloodLinger=30
AmbientParticles=1
SmoothShake=1
ImpactShake=1
Bloom=1
BloomStrength=55
ColorGrading=1
Vignette=35
; pst party of 8: the Nameless One and all seven companions (portrait strip widens past 6)
MaxPartySize=8
; turn-based combat
Turn Based Combat=1
Turn Based Weapon Speed=1
Turn Based Start On Sight=1
Turn Based Party Groups=1
Turn Based Auto End Turn=1
Turn Based Move Confirm=0
Turn Based Tactical AI=1
Turn Based Opportunity Attacks=1
Turn Based Immediate Reactions=1
Turn Based Surprise=1
Turn Based Floating Text=1
Turn Based Dice Panel=1
Turn Based Turn Banner=1
; line along the edge of the movement reach (the dimming outside it stays); off for now
Turn Based Reach Outline=0
Hover HP Bar=1
; always-on hotbar above the portraits, replaces the radial menu (right click cancels)
Hotbar=1
; voiced dialogue (PST AI Voices, tools\install_ai_voices.py) stops when the dialogue window closes
Stop Speech On Dialog End=1
; upscaled art (UPSCALE_PLAN.md): GL driver draws tools\upscale output at logical size
UpscaledGUI=1
UpscaledAreas=1
UpscaledSprites=1

[pst_saves/gem-torment.ini:Graphics]
; mouse-wheel zoom (phase 2)
Zoom Lock = 0
